dataset: cifar100
num_classes: 100
architecture: resnet18
input_shape: [3, 32, 32]

victim:
  epochs: 60
  batch_size: 128
  lr: 0.1
  weight_decay: 5.0e-4
  momentum: 0.9

geometry:
  n_projections: 100
  samples_per_class: 300
  semantic_source: cifar100_superclass   # no internet required
  alpha: 0.15
  k: 8

trigger:
  blend_alpha: 0.15

bait_w:
  epochs: 60
  poison_rate: 0.10
  lr: 0.1
  weight_decay: 5.0e-4
  momentum: 0.9

normalize:
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
